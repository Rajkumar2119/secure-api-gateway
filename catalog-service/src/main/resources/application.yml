server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/catalog_db}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
      issuer: ${JWT_ISSUER:secure-api-gateway}
  cache:
    product-ttl: 10m
    category-ttl: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,caches
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
