server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
      issuer: ${JWT_ISSUER:secure-api-gateway}
  gateway:
    auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8082}
    catalog-service-uri: ${CATALOG_SERVICE_URI:http://localhost:8083}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      api-replenish-rate: 20
      api-burst-capacity: 40
      auth-replenish-rate: 5
      auth-burst-capacity: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
