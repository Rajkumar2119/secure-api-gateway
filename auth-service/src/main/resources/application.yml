server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:auth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    jwt:
      # Demo default only. Set JWT_SECRET (32+ bytes) everywhere outside local development.
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
      issuer: ${JWT_ISSUER:secure-api-gateway}
      access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
